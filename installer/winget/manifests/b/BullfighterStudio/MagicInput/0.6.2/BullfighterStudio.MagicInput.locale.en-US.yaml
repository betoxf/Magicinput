ShortDescription: Use one keyboard and mouse across your Mac and Windows PC.
Description: |-
  MagicInput shares one keyboard and mouse between a Mac and a Windows PC. Push the pointer off the edge of one screen and keep going on the other: type, click, scroll, copy and paste as if it were one computer.
  It finds the other computer on your local network, pairs with a short code and encrypts everything end to end. Copied text follows the pointer, Ctrl and Cmd swap automatically, and photos AirDropped to the Mac can land in the PC's Downloads folder.
  Free for personal use with every feature. Install MagicInput on the Mac too (MagicInput.dmg on the releases page, or Homebrew).
