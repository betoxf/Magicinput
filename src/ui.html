<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MagicInput</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.08);
    --accent: #5b3fd9; --accent-text: #ffffff; --seg: #e8e8ed; --seg-on: #ffffff; --input: #ffffff;
    --ok: #30b158; --wait: #f5a524; --off: #a1a1a6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.08);
      --accent: #8b6cff; --seg: #3a3a3c; --seg-on: #636366; --input: #1c1c1e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default; }
  main { padding: 18px 18px 14px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  header svg { width: 40px; height: 40px; flex: none; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.wait { background: var(--wait); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  h2 { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 4px 6px; }
  .card { background: var(--card); border-radius: 10px; padding: 0 12px; box-shadow: 0 0 0 .5px var(--line); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; padding: 8px 0; }
  .row + .row { border-top: .5px solid var(--line); }
  .row .label { display: flex; flex-direction: column; }
  .sub { color: var(--muted); font-size: 11.5px; }
  .stack { flex-direction: column; align-items: stretch; gap: 6px; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--seg); border-radius: 20px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(14px); }
  input[type=range] { width: 150px; accent-color: var(--accent); }
  .val { color: var(--muted); font-variant-numeric: tabular-nums; width: 34px; text-align: right; }
  .code { font: 600 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .08em; -webkit-user-select: text; user-select: text; }
  button.btn { border: 0; border-radius: 6px; padding: 5px 11px; font: inherit; background: var(--seg); color: var(--text); }
  button.btn.primary { background: var(--accent); color: var(--accent-text); }
  button.btn:disabled { opacity: .45; }
  input[type=text] { font: 600 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; text-transform: uppercase;
    border: .5px solid var(--line); background: var(--input); color: var(--text); border-radius: 6px; padding: 5px 8px; width: 112px; outline: none; }
  input[type=text]:focus { box-shadow: 0 0 0 2px var(--accent); }
  .nowrap { white-space: nowrap; }
  .h2row { display: flex; justify-content: space-between; align-items: center; }
  .pill { border: 0; border-radius: 10px; padding: 2px 9px; font-family: inherit; font-size: 10.5px; font-weight: 600;
    background: var(--seg); color: var(--muted); text-transform: none; letter-spacing: .03em; }
  .pill.on { background: var(--accent); color: var(--accent-text); }
  #arrange { position: relative; height: 150px; margin: 4px 0 2px; touch-action: none; }
  .scr { position: absolute; border-radius: 5px; background: var(--seg); box-shadow: inset 0 0 0 1px var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--muted); overflow: hidden; }
  .peer { position: absolute; border-radius: 5px; color: #fff; font-size: 10.5px; font-weight: 600; cursor: grab;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 2px; overflow: hidden;
    background: linear-gradient(135deg, #5b3fd9, #9b5cf6); box-shadow: 0 2px 8px rgba(70,40,180,.35); transition: left .12s, top .12s; }
  .peer.auto { background: transparent; color: var(--accent); box-shadow: none; border: 1.5px dashed var(--accent); }
  .peer.drag { cursor: grabbing; transition: none; opacity: .92; }
  footer { margin-top: 14px; text-align: center; color: var(--muted); font-size: 11px; }
  kbd { font: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="100 100 824 824" aria-hidden="true">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E2A8F"/><stop offset=".55" stop-color="#5B3FD9"/><stop offset="1" stop-color="#9B5CF6"/></linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6C8"/><stop offset=".6" stop-color="#FFD25A"/><stop offset="1" stop-color="#FFAE1F"/></linearGradient>
      </defs>
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
      <g transform="translate(236,236) scale(23)">
        <path d="M5,3.2 L5,18.6 L8.9,14.9 L11.7,20.9 L14.1,19.8 L11.4,13.9 L16.6,13.6 Z" fill="#fff" stroke="#1B1450" stroke-width=".35" stroke-linejoin="round"/>
        <path fill="url(#gold)" d="M18.4,2.3 C18.994,5.005999999999999 18.994,5.005999999999999 21.7,5.6 C18.994,6.194 18.994,6.194 18.4,8.899999999999999 C17.805999999999997,6.194 17.805999999999997,6.194 15.099999999999998,5.6 C17.805999999999997,5.005999999999999 17.805999999999997,5.005999999999999 18.4,2.3 Z M21.6,8.8 C21.888,10.112 21.888,10.112 23.200000000000003,10.4 C21.888,10.688 21.888,10.688 21.6,12.0 C21.312,10.688 21.312,10.688 20.0,10.4 C21.312,10.112 21.312,10.112 21.6,8.8 Z M13.6,1.4500000000000002 C13.807,2.3930000000000002 13.807,2.3930000000000002 14.75,2.6 C13.807,2.807 13.807,2.807 13.6,3.75 C13.392999999999999,2.807 13.392999999999999,2.807 12.45,2.6 C13.392999999999999,2.3930000000000002 13.392999999999999,2.3930000000000002 13.6,1.4500000000000002 Z"/>
      </g>
    </svg>
    <div>
      <h1>MagicInput</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Starting…</span></div>
    </div>
  </header>

  <h2 class="h2row"><span>Arrangement</span><button class="pill" id="auto">Auto</button></h2>
  <div class="card">
    <div class="row stack">
      <div id="arrange"></div>
      <div class="sub" id="sideHint"></div>
    </div>
  </div>

  <h2>Pointer & keyboard</h2>
  <div class="card">
    <div class="row"><span>Pointer speed</span><span><input type="range" id="mouse_speed" min="0.5" max="2" step="0.05"> <span class="val" id="mouse_speed_v"></span></span></div>
    <div class="row"><span>Scroll speed</span><span><input type="range" id="scroll_speed" min="0.5" max="2" step="0.05"> <span class="val" id="scroll_speed_v"></span></span></div>
    <div class="row"><span class="label"><span id="swapLabel"></span><span class="sub" id="swapSub"></span></span><label class="switch"><input type="checkbox" id="swap"><span></span></label></div>
  </div>

  <h2>General</h2>
  <div class="card">
    <div class="row"><span class="label"><span>Share clipboard</span><span class="sub">Copied text follows the pointer</span></span><label class="switch"><input type="checkbox" id="clipboard"><span></span></label></div>
    <div class="row"><span>Start at login</span><label class="switch"><input type="checkbox" id="login"><span></span></label></div>
    <div class="row"><span id="trayLabel"></span><label class="switch"><input type="checkbox" id="tray"><span></span></label></div>
  </div>

  <h2>Pairing</h2>
  <div class="card">
    <div class="row"><span class="label"><span>This computer's code</span><span class="code" id="code">····-····</span></span><button class="btn" id="newCode">New code</button></div>
    <div class="row"><span class="label"><span>Other computer's code</span></span><span class="nowrap"><input type="text" id="pairInput" maxlength="9" placeholder="XXXX-XXXX" spellcheck="false"> <button class="btn primary" id="pair" disabled>Pair</button></span></div>
  </div>

  <footer><span id="escHint"></span> · v<span id="version"></span></footer>
</main>
<script>
  const send = (t, v) => window.ipc.postMessage(JSON.stringify({ t, v }));
  const $ = id => document.getElementById(id);
  let first = true;

  $('auto').onclick = () => send('auto');
  ['mouse_speed', 'scroll_speed'].forEach(id => {
    $(id).oninput = () => $(id + '_v').textContent = (+$(id).value).toFixed(2) + '×';
    $(id).onchange = () => send(id, +$(id).value);
  });
  ['swap', 'clipboard', 'login', 'tray'].forEach(id => $(id).onchange = () => send(id, $(id).checked));
  $('newCode').onclick = () => send('new_code');
  const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '');
  $('pairInput').oninput = () => $('pair').disabled = norm($('pairInput').value).length !== 8;
  $('pair').onclick = () => { send('pair', $('pairInput').value); $('pairInput').value = ''; $('pair').disabled = true; };
  $('pairInput').onkeydown = e => { if (e.key === 'Enter' && !$('pair').disabled) $('pair').click(); };

  // ---- Arrangement: this computer's screens (grey) and the other computer (purple), drawn to
  // scale. Drag the purple one along any outer edge; it snaps to edges and alignments.
  let S = null, drag = null, view = null;
  const area = $('arrange');
  const union = rs => { const x0 = Math.min(...rs.map(r => r.x)), y0 = Math.min(...rs.map(r => r.y));
    return { x: x0, y: y0, w: Math.max(...rs.map(r => r.x + r.w)) - x0, h: Math.max(...rs.map(r => r.y + r.h)) - y0 }; };
  const horiz = side => side === 'left' || side === 'right';

  // Rectangle of the other computer for a placement, in this computer's coordinates.
  function peerRect(p, U, size) {
    const along = p.length, across = horiz(p.side) ? size.w * along / size.h : size.h * along / size.w;
    if (p.side === 'right') return { x: U.x + U.w, y: p.offset, w: across, h: along };
    if (p.side === 'left') return { x: U.x - across, y: p.offset, w: across, h: along };
    if (p.side === 'bottom') return { x: p.offset, y: U.y + U.h, w: along, h: across };
    return { x: p.offset, y: U.y - across, w: along, h: across };
  }

  // Nearest placement for a block centred at (cx, cy), snapped to edge alignments.
  function placementAt(cx, cy, U, screens, size) {
    const dx = (cx - (U.x + U.w / 2)) / U.w, dy = (cy - (U.y + U.h / 2)) / U.h;
    const side = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'bottom' : 'top');
    const length = horiz(side) ? size.h : size.w;
    const u0 = horiz(side) ? U.y : U.x, ulen = horiz(side) ? U.h : U.w;
    const minOverlap = Math.min(length, ulen) * 0.15;
    let offset = (horiz(side) ? cy : cx) - length / 2;
    offset = Math.max(u0 - length + minOverlap, Math.min(u0 + ulen - minOverlap, offset));
    // Snap: line up the start, end or centre with any of this computer's screens.
    const snaps = [];
    for (const r of screens) { const a0 = horiz(side) ? r.y : r.x, alen = horiz(side) ? r.h : r.w;
      snaps.push(a0, a0 + alen - length, a0 + alen / 2 - length / 2); }
    const tol = ulen * 0.04;
    for (const sp of snaps) if (Math.abs(sp - offset) < tol) { offset = sp; break; }
    return { side, offset, length };
  }

  function drawArrange() {
    if (!S || !S.screens.length) { area.innerHTML = ''; return; }
    const U = union(S.screens), size = S.peer_size;
    const p = drag ? drag.p : (S.placement || { side: 'right', offset: U.y + U.h / 2 - size.h / 2, length: size.h });
    const P = peerRect(p, U, size), all = union([...S.screens, P]);
    // Fit everything into the area with some padding; keep the scale steady while dragging.
    if (!drag || !view) {
      const pad = 0.12, W = area.clientWidth, H = area.clientHeight;
      const ext = { x: all.x - all.w * pad, y: all.y - all.h * pad, w: all.w * (1 + 2 * pad), h: all.h * (1 + 2 * pad) };
      const k = Math.min(W / ext.w, H / ext.h);
      view = { k, ox: (W - ext.w * k) / 2 - ext.x * k, oy: (H - ext.h * k) / 2 - ext.y * k };
    }
    const px = r => `left:${r.x * view.k + view.ox}px;top:${r.y * view.k + view.oy}px;width:${r.w * view.k - 2}px;height:${r.h * view.k - 2}px`;
    let html = S.screens.map(r => `<div class="scr" style="${px(r)}">${r.name || ''}</div>`).join('');
    const label = S.peer || (S.os === 'mac' ? 'PC' : 'Mac');
    html += `<div class="peer${S.placement || drag ? '' : ' auto'}${drag ? ' drag' : ''}" id="peerBlock" style="${px(P)}">${label}</div>`;
    area.innerHTML = html;
    $('peerBlock').onpointerdown = e => {
      e.preventDefault();
      area.setPointerCapture(e.pointerId);
      const b = $('peerBlock').getBoundingClientRect();
      drag = { p, grabX: e.clientX - (b.left + b.width / 2), grabY: e.clientY - (b.top + b.height / 2) };
      drawArrange();
    };
  }
  area.onpointermove = e => {
    if (!drag || !S) return;
    const a = area.getBoundingClientRect();
    const cx = (e.clientX - drag.grabX - a.left - view.ox) / view.k, cy = (e.clientY - drag.grabY - a.top - view.oy) / view.k;
    drag.p = placementAt(cx, cy, union(S.screens), S.screens, S.peer_size);
    drawArrange();
  };
  area.onpointerup = () => {
    if (!drag) return;
    const p = drag.p; drag = null; view = null;
    S.placement = p; drawArrange();
    send('arrange', { side: p.side, offset: p.offset });
  };
  window.onresize = () => { view = null; drawArrange(); };

  window.render = s => {
    const mac = s.os === 'mac', other = mac ? 'PC' : 'Mac';
    let dot = 'dot', text;
    if (!s.running) text = s.login ? 'Starting…' : 'Not running';
    else if (!s.peer) { dot += ' wait'; text = 'Looking for your other computer…'; }
    else { dot += ' ok'; text = s.controlling ? 'Controlling ' + s.peer : s.controlled ? s.peer + ' is in control' : 'Connected to ' + s.peer; }
    $('dot').className = dot; $('status').textContent = text;

    S = s;
    if (!drag) { view = null; drawArrange(); }
    $('auto').classList.toggle('on', !s.placement);
    $('sideHint').textContent = s.placement
      ? `The pointer crosses where the screens touch (${s.placement.side} edge). Drag to rearrange.`
      : 'Auto: push firmly past the left or right edge. Drag the screen to pin where it is.';
    for (const id of ['mouse_speed', 'scroll_speed']) {
      if (document.activeElement !== $(id)) { $(id).value = s[id]; $(id + '_v').textContent = (+s[id]).toFixed(2) + '×'; }
    }
    $('swapLabel').textContent = mac ? 'Swap ⌘ and Ctrl with the PC' : 'Swap Ctrl and ⌘ with the Mac';
    $('swapSub').textContent = mac ? '⌘C copies on the PC' : 'Ctrl+C copies on the Mac';
    $('swap').checked = s.swap; $('clipboard').checked = s.clipboard; $('login').checked = s.login; $('tray').checked = s.tray;
    $('trayLabel').textContent = mac ? 'Show in menu bar' : 'Show in notification area';
    $('code').textContent = s.code;
    $('escHint').textContent = (mac ? '⌃⌥Esc' : 'Ctrl+Alt+Esc') + ' always brings the pointer home';
    $('version').textContent = s.version;
    if (first) { first = false; document.title = 'MagicInput'; }
  };
</script>
</body>
</html>
