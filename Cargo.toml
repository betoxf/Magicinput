[package]
name = "magicinput"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
directories = "6.0.0"
env_logger = { version = "0.11.11", default-features = false }
getrandom = "0.4.3"
if-addrs = "0.15"
log = "0.4.34"
mdns-sd = "0.21.5"
png = "0.18.1"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
tao = "0.37.1"
toml = "1.1.8"
tray-icon = "0.26.1"
window-vibrancy = "0.8.1"
wry = "0.57.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSButton", "NSControl", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder", "NSScreen", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSEnumerator", "NSURL", "NSDictionary", "NSData"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"
